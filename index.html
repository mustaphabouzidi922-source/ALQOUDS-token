<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة القدس الذكية - ALQOUDS FACTORY</title>
    <!-- استدعاء مكتبة ethers.js للإصدار السادس لإدارة معاملات ميتاماسك -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    <style>
        :root { 
            --bg-color: #0b0e11; 
            --card-bg: #181a20; 
            --primary-color: #f0b90b; 
            --text-color: #ffffff; 
            --border-color: #2b2f36; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 550px; 
            margin: auto; 
            border: 1px solid var(--border-color); 
            padding: 30px; 
            border-radius: 12px; 
            background: var(--card-bg); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
        }
        .btn { 
            background-color: var(--primary-color); 
            color: black; 
            border: none; 
            padding: 12px 25px; 
            cursor: pointer; 
            font-size: 16px; 
            border-radius: 6px; 
            font-weight: bold; 
            margin-top: 15px; 
            width: 100%; 
            transition: 0.3s; 
        }
        .btn:hover { opacity: 0.9; }
        .lang-select { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            padding: 8px 12px; 
            background: var(--border-color); 
            color: white; 
            border: 1px solid #474f59; 
            border-radius: 6px; 
            cursor: pointer; 
        }
        .logo-uploader { 
            margin: 25px auto; 
            width: 120px; 
            height: 120px; 
            border: 2px dashed var(--primary-color); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            position: relative; 
            overflow: hidden; 
            background: #202226; 
        }
        .logo-uploader img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .logo-uploader span { font-size: 28px; color: var(--primary-color); }
        #fileInput { display: none; }
        .form-group { text-align: right; margin-bottom: 15px; }
        .form-group.ltr { text-align: left; }
        label { display: block; margin-bottom: 5px; color: #b7bdc6; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 10px; 
            background: #2b2f36; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            color: white; 
            box-sizing: border-box; 
        }
        .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; word-break: break-all; }
        .success { background: #02c07622; color: #02c076; border: 1px solid #02c076; }
        .error { background: #f6465d22; color: #f6465d; border: 1px solid #f6465d; }
        footer { margin-top: 40px; color: #5e6673; font-size: 12px; }
    </style>
</head>
<body>

    <!-- زر اختيار اللغات الأربع المتاحة -->
    <select class="lang-select" id="langSelector" onchange="changeLanguage()">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="zh">中文</option>
    </select>

    <div class="container">
        <h1 id="title">منصة القدس - ALQOUDS FACTORY</h1>
        <p id="subtitle" style="color: #848e9c;">إنشاء وإطلاق التوكنات مباشرة عبر العقد المصنع الذكي الموثق</p>

        <!-- دائرة رفع الشعار وتفعيل المعاينة الفورية -->
        <div class="logo-uploader" onclick="document.getElementById('fileInput').click()">
            <span id="uploadText">＋</span>
            <img id="logoPreview" src="" alt="Logo">
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">

        <button class="btn" id="connectBtn" onclick="connectWallet()">ربط محفظة MetaMask</button>
        <p id="walletAddress" style="margin: 10px 0; color: #02c076; font-size: 14px; word-break: break-all;"></p>

        <div id="formContainer">
            <div class="form-group" id="groupName">
                <label id="lblName">اسم العملة:</label>
                <input type="text" id="tokenName" value="ALQOUDS">
            </div>
            <div class="form-group" id="groupSymbol">
                <label id="lblSymbol">رمز العملة (Ticker):</label>
                <input type="text" id="tokenSymbol" value="AQS">
            </div>
            <div class="form-group" id="groupSupply">
                <label id="lblSupply">الكمية الإجمالية (Supply):</label>
                <input type="number" id="tokenSupply" value="1000000000">
            </div>
            
            <button class="btn" id="mintBtn" onclick="deployViaFactory()" style="background-color: #02c076; color: white;">استدعاء المصنع وإنشاء العملة</button>
            <p style="color: #848e9c; font-size: 13px;" id="feeLabel">الرسوم الثابتة: 0.2 دولار (يتم تحويلها آلياً لـ BNB وتُرسل للمصنع الموثق)</p>
        </div>

        <div id="statusReport" class="status-box"></div>
    </div>

    <footer id="footerText">ALQOUDS Powered by 0xFactory.com</footer>

    <script>
        // عنوان عقد المصنع الذكي الموثق بالعلامة الخضراء
        const FACTORY_CONTRACT_ADDRESS = "0xe9682D65B724b6751b3DE799e8F05C7a7aC43C93"; 

        // واجهة الـ ABI لتوصيل أوامر الاستدعاء للمصنع الموثق
        const FACTORY_ABI = [
            "function createNewToken(string _name, string _symbol, uint256 _supply) public payable returns (address)"
        ];

        let provider, signer, userAddress = "";

        // حزم الترجمة الكاملة للغات الأربع
        const translations = {
            ar: { title: "منصة القدس - ALQOUDS", subtitle: "إنشاء وإطلاق التوكنات مباشرة عبر العقد المصنع الذكي الموثق", connect: "ربط محفظة MetaMask", lblName: "اسم العملة:", lblSymbol: "رمز العملة (Ticker):", lblSupply: "الكمية الإجمالية (Supply):", mintBtn: "استدعاء المصنع وإنشاء العملة", fee: "الرسوم الثابتة: 0.2 دولار (يتم تحويلها آلياً لـ BNB وتُرسل للمصنع الموثق)", install: "الرجاء تثبيت محفظة MetaMask أولاً!" },
            en: { title: "ALQOUDS Platform", subtitle: "Create & Launch Tokens via Verified Factory Contract", connect: "Connect MetaMask Wallet", lblName: "Token Name:", lblSymbol: "Token Symbol:", lblSupply: "Total Supply:", mintBtn: "Call Factory & Create Token", fee: "Fixed Fee: $0.2 (Converted automatically to BNB)", install: "Please install MetaMask extension!" },
            fr: { title: "Plateforme ALQOUDS", subtitle: "Créer des Tokens via le Contrat d'Usine Vérifié", connect: "Connecter MetaMask", lblName: "Nom du Token:", lblSymbol: "Symbole du Token:", lblSupply: "Offre Totale:", mintBtn: "Appeler l'Usine & Créer", fee: "Frais Fixes: 0.2 USD (Convertis en BNB)", install: "Veuillez installer MetaMask!" },
            zh: { title: "ALQOUDS 智能平台", subtitle: "通过已验证的工厂合约直接创建代币", connect: "连接 MetaMask 钱包", lblName: "代币名称:", lblSymbol: "代币缩写:", lblSupply: "总供应量:", mintBtn: "调用工厂并创建代币", fee: "固定费用: 0.2 美元 (自动转换为 BNB)", install: "请先安装 MetaMask 钱包!" }
        };

        function changeLanguage() {
            const lang = document.getElementById("langSelector").value;
            const t = translations[lang];
            
            document.getElementById("title").innerText = t.title;
            document.getElementById("subtitle").innerText = t.subtitle;
            document.getElementById("lblName").innerText = t.lblName;
            document.getElementById("lblSymbol").innerText = t.lblSymbol;
            document.getElementById("lblSupply").innerText = t.lblSupply;
            document.getElementById("mintBtn").innerText = t.mintBtn;
            document.getElementById("feeLabel").innerText = t.fee;
            document.body.dir = (lang === "ar") ? "rtl" : "ltr";
            
            ["groupName", "groupSymbol", "groupSupply"].forEach(id => {
                document.getElementById(id).className = (lang === "ar") ? "form-group" : "form-group ltr";
            });
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById("logoPreview").src = e.target.result;
                    document.getElementById("logoPreview").style.display = "block";
                    document.getElementById("uploadText").style.display = "none";
                }
                reader.readAsDataURL(file);
            }
        }

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = accounts[0];
                    document.getElementById("connectBtn").style.display = "none";
                    document.getElementById("walletAddress").innerText = "✔ المتصل الحالي: " + userAddress.substring(0,6) + "..." + userAddress.substring(34);
                } catch (error) { console.error(error); }
            } else { alert("الرجاء تثبيت محفظة MetaMask أولاً!"); }
        }

        // دالة التنفيذ الأساسية والمباشرة لمصنع العقود الموثق
        async function deployViaFactory() {
            const statusBox = document.getElementById("statusReport");
            statusBox.style.display = "block";
            
            if (!userAddress) {
                await connectWallet();
                if (!userAddress) return;
            }

            try {
                statusBox.className = "status-box success";
                statusBox.innerHTML = "⏳ جاري إرسال طلب إنشاء التوكن إلى المصنع الموثق وتأكيد المعاملة في MetaMask...";

                const name = document.getElementById("tokenName").value;
                const symbol = document.getElementById("tokenSymbol").value;
                const supply = document.getElementById("tokenSupply").value;

                // ربط العقد المصنع الموثق باستخدام الـ ABI وعنوانه
                const factoryContract = new ethers.Contract(FACTORY_CONTRACT_ADDRESS, FACTORY_ABI, signer);

                // تحديد قيمة رسوم الخدمة (تعادل بالرمز 0.00035 BNB)
                const feeValue = ethers.parseEther("0.00035");

                // استدعاء دالة المصنع الحقيقية
                const tx = await factoryContract.createNewToken(name, symbol, supply, { value: feeValue });

                statusBox.innerHTML = `⏳ تم إرسال المعاملة بنجاح! في انتظار التأكيد على الشبكة...<br><a href="https://bscscan.com/tx/${tx.hash}" target="_blank" style="color: #f0b90b;">رابط المعاملة على BscScan</a>`;

                const receipt = await tx.wait();
                
                statusBox.innerHTML = `✅ <b>تم إنشاء وإطلاق عملتك بنجاح تام عبر المصنع الموثق!</b><br>🎉 مبروك، عملتك أصبحت الآن على شبكة BNB Chain.<br><a href="https://bscscan.com/tx/${receipt.hash}" target="_blank" style="color: #f0b90b;">عرض تفاصيل النجاح على BscScan</a>`;

            } catch (error) {
                console.error(error);
                statusBox.className = "status-box error";
                statusBox.innerHTML = "❌ حدث خطأ أثناء التنفيذ أو تم إلغاء المعاملة من محفظتك.";
            }
        }
    </script>
</body>
</html>
