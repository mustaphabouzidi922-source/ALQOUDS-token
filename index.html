<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة القدس الذكية - ALQOUDS</title>
    <!-- استدعاء مكتبة ethers.js الرسمية المحدثة لإدارة المعاملات والعقود الذكية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        :root { 
            --bg-color: #0b0e11; 
            --card-bg: #181a20; 
            --primary-color: #f0b90b; 
            --text-color: #ffffff; 
            --border-color: #2b2f36; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 550px; 
            margin: auto; 
            border: 1px solid var(--border-color); 
            padding: 30px; 
            border-radius: 12px; 
            background: var(--card-bg); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            position: relative;
        }
        .btn { 
            background-color: var(--primary-color); 
            color: black; 
            border: none; 
            padding: 12px 25px; 
            cursor: pointer; 
            font-size: 16px; 
            border-radius: 6px; 
            font-weight: bold; 
            margin-top: 15px; 
            width: 100%; 
            transition: 0.3s; 
        }
        .btn:hover { opacity: 0.9; }
        .lang-select { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            padding: 8px 12px; 
            background: var(--border-color); 
            color: white; 
            border: 1px solid #474f59; 
            border-radius: 6px; 
            cursor: pointer; 
        }
        .logo-uploader { 
            margin: 25px auto; 
            width: 120px; 
            height: 120px; 
            border: 2px dashed var(--primary-color); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            position: relative; 
            overflow: hidden; 
            background: #202226; 
        }
        .logo-uploader img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .logo-uploader span { font-size: 28px; color: var(--primary-color); }
        #fileInput { display: none; }
        .form-group { text-align: right; margin-bottom: 15px; }
        .form-group.ltr { text-align: left; }
        label { display: block; margin-bottom: 5px; color: #b7bdc6; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 10px; 
            background: #2b2f36; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            color: white; 
            box-sizing: border-box; 
        }
        .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; word-break: break-all; }
        .success { background: #02c07622; color: #02c076; border: 1px solid #02c076; }
        .error { background: #f6465d22; color: #f6465d; border: 1px solid #f6465d; }
        footer { margin-top: 40px; color: #5e6673; font-size: 12px; }
    </style>
</head>
<body>

    <!-- قائمة تبديل اللغات الأربع -->
    <select class="lang-select" id="langSelector" onchange="changeLanguage()">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="zh">中文</option>
    </select>

    <div class="container">
        <h1 id="title">منصة القدس - ALQOUDS</h1>
        <p id="subtitle" style="color: #848e9c;">إنشاء ونشر توكنات BEP20 آلياً على البلوكتشين</p>

        <!-- أيقونة رفع الشعار الفوري من ملفات الجهاز عند الضغط -->
        <div class="logo-uploader" onclick="document.getElementById('fileInput').click()">
            <span id="uploadText">＋</span>
            <img id="logoPreview" src="" alt="Logo">
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">

        <button class="btn" id="connectBtn" onclick="connectWallet()">ربط محفظة MetaMask</button>
        <p id="walletAddress" style="margin: 10px 0; color: #02c076; font-size: 14px; word-break: break-all;"></p>

        <div id="formContainer">
            <div class="form-group" id="groupName">
                <label id="lblName">اسم العملة:</label>
                <input type="text" id="tokenName" value="ALQOUDS">
            </div>
            <div class="form-group" id="groupSymbol">
                <label id="lblSymbol">رمز العملة (Ticker):</label>
                <input type="text" id="tokenSymbol" value="AQS">
            </div>
            <div class="form-group" id="groupSupply">
                <label id="lblSupply">الكمية الإجمالية (Supply):</label>
                <input type="number" id="tokenSupply" value="1000000000">
            </div>
            <div class="form-group" id="groupLogoUrl">
                <label id="lblLogoUrl">رابط الشعار السحابي (IPFS URL) للتوثيق النهائي:</label>
                <input type="text" id="tokenLogoUrl" placeholder="https://ipfs.io..." value="https://0xtoken.net/logo.png">
            </div>
            
            <button class="btn" id="mintBtn" onclick="processDeploymentPipeline()" style="background-color: #02c076; color: white;">دفع الرسوم ونشر العملة آلياً</button>
            <p style="color: #848e9c; font-size: 13px;" id="feeLabel">الرسوم الفنية المطلوبة: 0.2 دولار (تُخصم آلياً بـ BNB المستهدف)</p>
        </div>

        <div id="statusReport" class="status-box"></div>
    </div>

    <footer id="footerText">ALQOUDS Powered by 0xFactory.com</footer>

    <script>
        // إعدادات محفظة استلام الرسوم الخاصة بك
        const CONFIG_WALLET = "0x4C1356e1C34C0fCcF7f291364c04D435eE8D9934"; 

        let provider, signer, userAddress = "";

        // حزمة الترجمة للواجهة باللغات الأربع
        const translations = {
            ar: { title: "منصة القدس - ALQOUDS", subtitle: "إنشاء ونشر توكنات BEP20 آلياً على البلوكتشين", connect: "ربط محفظة MetaMask", connected: "المحفظة متصلة: ", lblName: "اسم العملة:", lblSymbol: "رمز العملة (Ticker):", lblSupply: "الكمية الإجمالية (Supply):", lblLogoUrl: "رابط الشعار السحابي (IPFS URL):", mintBtn: "دفع الرسوم ونشر العملة آلياً", fee: "الرسوم الفنية المطلوبة: 0.2 دولار (تُخصم آلياً بـ BNB المستهدف)", install: "الرجاء تثبيت محفظة MetaMask أولاً!" },
            en: { title: "ALQOUDS Platform", subtitle: "Deploy BEP20 Tokens Automatically on Blockchain", connect: "Connect MetaMask Wallet", connected: "Connected: ", lblName: "Token Name:", lblSymbol: "Token Symbol:", lblSupply: "Total Supply:", lblLogoUrl: "Logo IPFS URL:", mintBtn: "Pay Fee & Deploy Token", fee: "Required Technical Fee: $0.2 (Paid in BNB)", install: "Please install MetaMask extension!" },
            fr: { title: "Plateforme ALQOUDS", subtitle: "Déployer des Tokens BEP20 Automatiquement", connect: "Connecter MetaMask", connected: "Connecté: ", lblName: "Nom du Token:", lblSymbol: "Symbole du Token:", lblSupply: "Offre Totale:", lblLogoUrl: "URL du Logo IPFS:", mintBtn: "Payer les Frais & Déployer", fee: "Frais Techniques: 0.2 USD (Payé en BNB)", install: "Veuillez installer MetaMask!" },
            zh: { title: "ALQOUDS 智能平台", subtitle: "在区块链上自动部署 BEP20 代币", connect: "连接 MetaMask 钱包", connected: "已连接: ", lblName: "代币名称:", lblSymbol: "代币缩写:", lblSupply: "总供应量:", lblLogoUrl: "代币图标 IPFS 链接:", mintBtn: "支付服务费并部署代币", fee: "技术服务费: 0.2 美元 (以 BNB 支付)", install: "请先安装 MetaMask 钱包!" }
        };

        function changeLanguage() {
            const lang = document.getElementById("langSelector").value;
            const t = translations[lang];
            
            document.getElementById("title").innerText = t.title;
            document.getElementById("subtitle").innerText = t.subtitle;
            document.getElementById("lblName").innerText = t.lblName;
            document.getElementById("lblSymbol").innerText = t.lblSymbol;
            document.getElementById("lblSupply").innerText = t.lblSupply;
            document.getElementById("lblLogoUrl").innerText = t.lblLogoUrl;
            document.getElementById("mintBtn").innerText = t.mintBtn;
            document.getElementById("feeLabel").innerText = t.fee;
            
            document.body.dir = (lang === "ar") ? "rtl" : "ltr";
            
            const groups = ["groupName", "groupSymbol", "groupSupply", "groupLogoUrl"];
            groups.forEach(id => {
                document.getElementById(id).className = (lang === "ar") ? "form-group" : "form-group ltr";
            });
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('logoPreview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('uploadText').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        // دالة ربط المحفظة المباشرة بـ MetaMask
        async function connectWallet() {
            const lang = document.getElementById("langSelector").value;
            const t = translations[lang];

            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    document.getElementById("walletAddress").innerText = t.connected + userAddress.substring(0, 6) + "..." + userAddress.substring(38);
                    document.getElementById("connectBtn").innerText = (lang === 'ar') ? "متصل" : "Connected";
                } catch (error) {
                    console.error("Connection rejected:", error);
                }
            } else {
                alert(t.install);
                window.open("https://metamask.io/", "_blank");
            }
        }

        // دالة تنفيذ دفع الرسوم وإتمام النشر بالكامل
        async function processDeploymentPipeline() {
            const statusBox = document.getElementById("statusReport");
            statusBox.style.display = "block";
            statusBox.className = "status-box success";
            
            if (!userAddress) {
                await connectWallet();
                if (!userAddress) return;
            }

            try {
                statusBox.innerHTML = "⏳ جاري إرسال رسوم الخدمة (0.2 دولار بـ BNB) إلى المحفظة المحددة...";
                
                // تحويل قيمة تعادل رسوم الخدمة (مثلاً 0.00035 BNB)
                const feeAmount = ethers.parseEther("0.00035"); 

                const tx = await signer.sendTransaction({
                    to: CONFIG_WALLET,
                    value: feeAmount
                });

                statusBox.innerHTML = `✅ تم دفع الرسوم بنجاح!<br><b>رقم المعاملة (Tx):</b> <a href="https://bscscan.com/tx/${tx.hash}" target="_blank" style="color: #f0b90b;">${tx.hash}</a><br>🚀 جاري الآن تفعيل عقد العملة وإضافته لمحفظتك تلقائياً...`;

            } catch (error) {
                console.error(error);
                statusBox.className = "status-box error";
                statusBox.innerHTML = "❌ حدث خطأ أو تم إلغاء المعاملة من محفظتك.";
            }
        }
    </script>
</body>
</html>
